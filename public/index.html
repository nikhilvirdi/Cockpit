<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cockpit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main>
        <h1>Cockpit</h1>
        <p class="tagline">Your dev environment, at a glance.</p>

        <section>
            <h2>Projects</h2>
            <table id="projects-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Branch</th>
                        <th>Status</th>
                        <th>Last Commit</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section>
            <h2>Services</h2>
            <table id="services-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Host</th>
                        <th>Port</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
